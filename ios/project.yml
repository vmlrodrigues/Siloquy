# XcodeGen spec for the Siloquy iOS app.
# Regenerate the .xcodeproj with:  cd ios && xcodegen generate
#
# Two targets:
#   • Siloquy        — the app (Speech + FoundationModels, on-device)
#   • SiloquyWidget  — widget extension hosting the dictation Live Activity (Dynamic Island)
# Requires iOS 26 + an Apple-Intelligence device (iPhone 15 Pro and later).

name: Siloquy
options:
  bundleIdPrefix: com.victorrodrigues
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "9N354A3UZK"  # paid Developer Program team (Victor Rodrigues) —
                                    # required for TestFlight/App Store distribution.
    MARKETING_VERSION: "0.1.3"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Siloquy:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Siloquy
      - path: Shared
    dependencies:
      - target: SiloquyWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.victorrodrigues.siloquy.ios
        PRODUCT_NAME: Siloquy
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Siloquy/Info.plist
      properties:
        CFBundleDisplayName: Siloquy
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
        UIApplicationSupportsIndirectInputEvents: true
        NSMicrophoneUsageDescription: "Siloquy uses the microphone to capture your dictation — processed entirely on your device."
        NSSpeechRecognitionUsageDescription: "Siloquy transcribes your speech entirely on your device."
        NSSupportsLiveActivities: true
        UIBackgroundModes:
          - audio

  # Issue #39 — measures the iOS 27 on-device model. Requires iOS 27 because the
  # Evaluations framework does; the app itself stays on 26.0.
  SiloquyBench:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      - path: SiloquyBench
    dependencies:
      - target: Siloquy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.victorrodrigues.siloquy.ios.bench
        GENERATE_INFOPLIST_FILE: YES

  SiloquyWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: SiloquyWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.victorrodrigues.siloquy.ios.widget
        PRODUCT_NAME: SiloquyWidget
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: SiloquyWidget/Info.plist
      properties:
        CFBundleDisplayName: Siloquy
        # Must match the host app's version/build or App Store upload validation fails.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

# Explicit shared scheme so "Siloquy" (the app) is always the one you run —
# building it also builds + embeds the widget extension. Survives regeneration.
schemes:
  Siloquy:
    build:
      targets:
        Siloquy: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SiloquyBench
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
