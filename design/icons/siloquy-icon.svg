<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#3A3431"/><stop offset="0.55" stop-color="#241A15"/><stop offset="1" stop-color="#130E0B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.52">
      <stop offset="0" stop-color="#D98A45" stop-opacity="0.55"/><stop offset="0.7" stop-color="#C97A3C" stop-opacity="0.10"/><stop offset="1" stop-color="#C97A3C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/><stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mic" x1="0.3" y1="0" x2="0.7" y2="1">
